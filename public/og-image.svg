<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A5F"/>
      <stop offset="100%" stop-color="#0D4A6B"/>
    </linearGradient>
    <linearGradient id="glow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#0D9488" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0D9488" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Subtle radial glow -->
  <circle cx="600" cy="315" r="400" fill="#0D9488" opacity="0.08"/>
  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="120" fill="#0D9488" opacity="0.06"/>
  <circle cx="1100" cy="530" r="180" fill="#F59E0B" opacity="0.05"/>
  <circle cx="1050" cy="120" r="60" fill="#0D9488" opacity="0.1"/>
  <!-- Icon: large circle with arrow -->
  <circle cx="180" cy="315" r="80" fill="white" opacity="0.08"/>
  <circle cx="180" cy="315" r="64" fill="white" opacity="0.06"/>
  <path d="M180 365 L180 270 M150 300 L180 268 L210 300" stroke="white" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="180" cy="374" r="5" fill="white" opacity="0.5"/>
  <!-- Wordmark -->
  <text x="290" y="295" font-family="Inter, Arial, sans-serif" font-size="88" font-weight="800" fill="white" letter-spacing="-2">Inter</text>
  <text x="624" y="295" font-family="Inter, Arial, sans-serif" font-size="88" font-weight="800" fill="#0D9488" letter-spacing="-2">ship</text>
  <!-- Tagline -->
  <text x="290" y="348" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="400" fill="white" opacity="0.7" letter-spacing="3">FIND YOUR PERFECT INTERNSHIP</text>
  <!-- Domain -->
  <text x="290" y="410" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#F59E0B" letter-spacing="1">intership.in</text>
  <!-- Bottom decoration -->
  <line x1="290" y1="430" x2="700" y2="430" stroke="white" stroke-width="1" opacity="0.15"/>
</svg>
